version: "3.8"

services:
  # ─────────────────────────────────────────────────────────
  # Infrastructure
  # ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: devfleet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devfleet
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: devfleet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devfleet"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devfleet-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────
  # Backend API (Express + Prisma)
  # Runs: prisma migrate deploy → npm start
  # ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./Devfleet-backend
      dockerfile: Dockerfile
    container_name: devfleet-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Database
      - DATABASE_URL=postgresql://devfleet:password123@postgres:5432/devfleet?schema=public
      # Redis (BullMQ)
      - REDIS_URL=redis://redis:6379
      # Server
      - PORT=3000
      - API_URL=http://localhost:3000
      # CORS – must match the origin the browser uses to reach the frontend
      - FRONTEND_URL=http://localhost
      # Auth
      - JWT_SECRET=change-me-in-production
      # GitHub OAuth (set your real values or leave blank to disable OAuth in Docker)
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      # Email (leave blank to skip email features in Docker)
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASS=${EMAIL_PASS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────
  # BullMQ Worker (same image, different entrypoint)
  # ─────────────────────────────────────────────────────────
  worker:
    build:
      context: ./Devfleet-backend
      dockerfile: Dockerfile
    container_name: devfleet-worker
    restart: unless-stopped
    # Override CMD – worker only; no HTTP server, no migration needed
    # (backend already ran migrate deploy on the same DB)
    command: ["npm", "run", "worker"]
    environment:
      - DATABASE_URL=postgresql://devfleet:password123@postgres:5432/devfleet?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=change-me-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Depend on backend so migrations run first
      backend:
        condition: service_started

  # ─────────────────────────────────────────────────────────
  # Frontend (Vue 3 + Vite → nginx)
  # VITE_API_BASE_URL is baked in at build time
  # ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./Devfleet-frontend
      dockerfile: Dockerfile
      args:
        # The browser calls this URL – must be reachable from the user's machine
        VITE_API_BASE_URL: http://localhost:3000
    container_name: devfleet-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
